[package]
name = "farmledge-receipt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
near-sdk = { version = "5.30.1", features = ["legacy", "unit-testing"] }
borsh = { version = "1.5", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
abi = ["near-sdk/abi"]

[dev-dependencies]
proptest = "1"
